appId: com.machinery.machinery.dev
name: Cold-start against the live API and sign in as the director
---
# The live flows write real rows, so they never reset the server the way the
# mock flows do. They only reset the device, and every record they create is
# named with a run-unique suffix so a second run does not collide with the
# first.
- clearState
- launchApp:
    clearKeychain: true

# Physical devices (esp. Samsung) can briefly report no transport right after
# a cold start / clearState. Wait for the form, then give connectivity a beat
# before submitting so the first-login offline guard does not false-negative.
- extendedWaitUntil:
    visible:
      id: "login_phone_field"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "login_phone_field"
- inputText: ${PHONE}
- tapOn:
    id: "login_password_field"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login_submit_button"

# Fresh installs on a biometric device offer enrollment after a successful
# login. Dismiss it so the home tab assertion is not blocked by the sheet.
- tapOn:
    text: "مش دلوقتي"
    optional: true

# The director lands straight on the home tab; no forced password change.
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 40000
