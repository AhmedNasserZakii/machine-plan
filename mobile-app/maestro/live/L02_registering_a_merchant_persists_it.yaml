appId: com.machinery.machinery.dev
name: L02 — Registering a merchant writes it to the database and lists it
tags:
  - live
  - merchants
---
- runFlow:
    file: shared/launch_and_login.yaml
    env:
      PHONE: "01000000001"
      PASSWORD: "Dev#12345"

# Every run writes a real row, so the identifying fields carry a run-unique
# suffix. A national ID is unique server-side; reusing one would make the
# second run fail for the wrong reason.
- evalScript: |
    ${
      output.suffix = String(Date.now()).slice(-8);
      output.shop = 'محل الاختبار ' + output.suffix;
      output.phone = '010' + output.suffix;
      output.nationalId = '298010' + output.suffix;
    }

- tapOn: "(?s).*التجار.*"
- extendedWaitUntil:
    visible:
      id: "merchants_add_button"
    timeout: 15000
- tapOn:
    id: "merchants_add_button"
- extendedWaitUntil:
    visible:
      id: "merchant_form_shop_name"
    timeout: 15000

# Hide the keyboard after every field — on a physical phone the IME covers the
# lower inputs and Maestro will tap / type into a collapsed field.
- tapOn:
    id: "merchant_form_shop_name"
- inputText: ${output.shop}
- hideKeyboard
- tapOn:
    id: "merchant_form_name"
- inputText: "أحمد صاحب المحل"
- hideKeyboard
- tapOn:
    id: "merchant_form_phone"
- inputText: ${output.phone}
- hideKeyboard
- tapOn:
    id: "merchant_form_address"
- inputText: "شارع الجمهورية، المنصورة"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "merchant_form_national_id"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "merchant_form_national_id"
- inputText: ${output.nationalId}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "merchant_form_submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "merchant_form_submit"

# Wait for the list chrome, not just the shop name — the form still shows the
# typed shop value for a beat after submit, which would false-pass the next step.
- extendedWaitUntil:
    visible:
      id: "merchants_add_button"
    timeout: 30000
- extendedWaitUntil:
    visible: "(?s).*${output.shop}.*"
    timeout: 20000

# On this physical device Material 3 only exposes the *selected* bottom-nav
# label to accessibility, so leaving via Home/More is unreliable. Opening the
# detail screen forces GET /merchants/:id — that is the persistence proof.
- tapOn: "(?s).*${output.shop}.*"
- extendedWaitUntil:
    visible: "(?s).*أحمد صاحب المحل.*"
    timeout: 15000
- assertVisible: "(?s).*${output.phone}.*"
- assertVisible: "(?s).*${output.nationalId}.*"
