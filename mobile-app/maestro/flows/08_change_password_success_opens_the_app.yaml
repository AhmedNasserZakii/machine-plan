appId: com.machinery.machinery.dev
name: 08 — Changing the password clears the block and lands on the app
tags:
  - auth
  - smoke
---
- runFlow: shared/reset_and_launch.yaml

- runFlow:
    file: shared/login_as.yaml
    env:
      PHONE: "01000000002"
      PASSWORD: "Password1"

- assertVisible: "لازم تغيّر كلمة السر"

# The submit button stays disabled until all three fields agree.
- tapOn:
    id: "current_password_field"
- inputText: "Password1"
- hideKeyboard
- assertVisible:
    id: "change_password_submit_button"
    enabled: false

- tapOn:
    id: "new_password_field"
- inputText: "BrandNew123"
- tapOn:
    id: "confirm_password_field"
- inputText: "Mismatch123"
- hideKeyboard
- assertVisible:
    id: "change_password_submit_button"
    enabled: false

# Correct the confirmation and it unlocks.
- tapOn:
    id: "confirm_password_field"
- eraseText: 20
- inputText: "BrandNew123"
- hideKeyboard
- assertVisible:
    id: "change_password_submit_button"
    enabled: true

- tapOn:
    id: "change_password_submit_button"

# The toast exposes title and body as a single node.
- assertVisible: "(?s).*كلمة السر اتغيّرت، وكل الأجهزة التانية اتسجّل خروجها.*"

# The forced screen is replaced, not stacked, so the app is now reachable.
- assertVisible: "الرئيسية"
- assertNotVisible: "لازم تغيّر كلمة السر"
