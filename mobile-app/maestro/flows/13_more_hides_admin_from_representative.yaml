appId: com.machinery.machinery.dev
name: 13 — A Representative gets no user administration in More
tags:
  - permissions
  - more
---
- runFlow: shared/reset_and_launch.yaml

- runFlow:
    file: shared/login_as.yaml
    env:
      PHONE: "01000000003"
      PASSWORD: "Password1"

# merchants.read is part of the real Representative grant, so the merchants tab
# is present here even though finance is not.
- assertVisible: "(?s).*التجار.*"
- assertNotVisible: "(?s).*المالية.*"

- tapOn: "(?s).*المزيد.*"

- assertVisible: "(?s).*محمود توباي.*"
- assertVisible: "(?s).*فرع المنصورة.*"

# A Representative holds no users.read, so that row is never rendered — the
# user never sees a link to a screen the server would reject anyway. Reports
# IS visible: the merchants and maintenance reports are gated on the same
# merchants.read/maintenance.read the domain screens use (backend
# reports.controller.ts), not a dedicated reports.* code, and this
# Representative holds merchants.read.
- assertVisible:
    id: "more_reports_tile"
- assertNotVisible:
    id: "more_users_tile"

# Everything that does not need a permission is still there. A Representative
# still has enough tiles (reports, violations x2, decommission candidates,
# notifications) to push the account section past the fold on a phone.
- assertVisible:
    id: "more_notifications_tile"
- scrollUntilVisible:
    element:
      id: "more_language_tile"
    direction: DOWN
- assertVisible:
    id: "more_language_tile"
- scrollUntilVisible:
    element:
      id: "more_logout_tile"
    direction: DOWN
- assertVisible:
    id: "more_logout_tile"
