appId: com.machinery.machinery.dev
name: 07 — A wrong current password is reported on the right field
tags:
  - auth
---
- runFlow: shared/reset_and_launch.yaml

- runFlow:
    file: shared/login_as.yaml
    env:
      PHONE: "01000000002"
      PASSWORD: "Password1"

- assertVisible: "لازم تغيّر كلمة السر"

- tapOn:
    id: "current_password_field"
- inputText: "NotMyPassword1"
- tapOn:
    id: "new_password_field"
- inputText: "BrandNew123"
- tapOn:
    id: "confirm_password_field"
- inputText: "BrandNew123"
- hideKeyboard

- tapOn:
    id: "change_password_submit_button"

- assertVisible: "كلمة السر الحالية غلط."

# Rejected, so the user is still stuck here.
- assertVisible: "لازم تغيّر كلمة السر"
- assertNotVisible: "الرئيسية"
