appId: com.machinery.machinery.dev
name: 06 — mustChangePassword traps the user on the change-password screen
tags:
  - auth
  - smoke
---
- runFlow: shared/reset_and_launch.yaml

- runFlow:
    file: shared/login_as.yaml
    env:
      PHONE: "01000000002"
      PASSWORD: "Password1"

- assertVisible: "لازم تغيّر كلمة السر"
- assertVisible: "دي أول مرة تدخل، اختار كلمة سر جديدة عشان تكمّل"

# The app is not reachable until the password is changed.
- assertNotVisible: "الرئيسية"

# Hardware back must not escape the screen, and must not background the app.
- back
- assertVisible: "لازم تغيّر كلمة السر"
- assertNotVisible: "الرئيسية"
