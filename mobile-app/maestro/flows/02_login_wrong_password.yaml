appId: com.machinery.machinery.dev
name: 02 — Wrong password shows the mapped error and keeps the user on login
tags:
  - auth
---
- runFlow: shared/reset_and_launch.yaml

- runFlow:
    file: shared/login_as.yaml
    env:
      PHONE: "01000000001"
      PASSWORD: "WrongPass9"

# INVALID_CREDENTIALS is a mapped code, so ErrorMapper deliberately shows the
# app's own wording instead of the server string — offline and online errors
# have to read identically. The toast merges its title and body into one
# accessibility node, hence the loose match.
- assertVisible: "(?s).*رقم التليفون أو الباسورد غلط.*"

# Still on login, and the form is still submittable for a retry.
- assertVisible: "أهلًا بيك"
- assertVisible:
    id: "login_submit_button"
    enabled: true
